services:
  avaliador-mods:
    # This branch publishes its delivery candidate under its own immutable channel.
    # `latest` remains reserved for the main branch / production release.
    image: ghcr.io/thiago-caffaro/equilibrium-mod-rater:merchant-core-foundation
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${EQUILIBRIUM_PORT:-8787}:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NODE_ENV: production
    volumes:
      - equilibrium-data:/app/data

volumes:
  equilibrium-data:
    name: equilibrium-data
