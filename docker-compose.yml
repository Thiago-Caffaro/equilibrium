services:
  avaliador-mods:
    image: ghcr.io/thiago-caffaro/equilibrium-mod-rater:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${EQUILIBRIUM_PORT:-8787}:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NODE_ENV: production
    volumes:
      - equilibrium-data:/app/data

volumes:
  equilibrium-data:
    name: equilibrium-data
